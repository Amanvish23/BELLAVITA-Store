<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bellavita Cart</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<section class="cart-section">

    <h1>Your Shopping Cart</h1>


    <div class="cart-wrapper">


        <!-- CART PRODUCTS -->

        <div id="cart-container"></div>


        <!-- ORDER SUMMARY -->

        <div class="cart-summary">

            <h2>Order Summary</h2>


            <p>
                Shipping :
                <span>FREE</span>
            </p>


            <hr>


            <h3 id="total-price">
                Total : ₹0
            </h3>


            <a
                href="checkout.html"
                class="btn"
                id="checkout-btn"
            >
                Proceed To Checkout
            </a>


            <a
                href="index.html"
                class="continue-btn"
            >
                Continue Shopping
            </a>

        </div>

    </div>

</section>



<!-- LOGIN PROTECTION -->

<script>

const currentUser =
    JSON.parse(
        localStorage.getItem("currentUser")
    );


if (!currentUser) {

    alert(
        "Please login first to access your cart."
    );

    window.location.href =
        "login.html";

}

</script>


<script src="js/cart.js"></script>


</body>

</html>
